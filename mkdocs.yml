site_name: Game development reference
site_description: Personal notes on maths, graphics, physics, gameplay, Unity, and engine architecture.
site_author: Stuart
site_url: https://stuart6854.github.io/gamedev-reference/
repo_url: https://github.com/stuart6854/gamedev-reference
repo_name: stuart6854/gamedev-reference
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Stuart

nav:
  - Home: index.md
  - Maths:
      - maths/index.md
      - Interpolation and easing: maths/interpolation.md
  - Graphics:
      - graphics/index.md
      - Coordinate spaces: graphics/coordinate-spaces.md
  - Physics:
      - physics/index.md
  - Gameplay & AI:
      - gameplay/index.md
  - Unity:
      - unity/index.md
      - Third-person orbit camera: unity/orbit-camera.md
      - Mechanics:
          - unity/mechanics/index.md
          - Character movement: unity/mechanics/character-movement.md
  - Engine architecture:
      - engine/index.md
  - Optimisation:
      - optimisation/index.md

theme:
  name: material
  language: en
  icon:
    logo: material/cube-outline
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js

hooks:
  - hooks/version_pills.py

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/stuart6854

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
