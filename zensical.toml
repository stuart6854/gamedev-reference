[project]
site_name = "Game development reference"
site_description = "Personal notes on maths, data structures, graphics, physics, gameplay, Unity, and engine architecture."
site_author = "Stuart"
site_url = "https://stuart6854.github.io/gamedev-reference/"
repo_url = "https://github.com/stuart6854/gamedev-reference"
repo_name = "stuart6854/gamedev-reference"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Stuart"

extra_css = ["stylesheets/extra.css"]
extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js",
]

# Sections with no pages yet. Their outlines stay in docs/ but are not built.
# When a section gets its first page, remove it here and add it to the nav.
exclude_docs = """
gameplay/
optimisation/
"""

